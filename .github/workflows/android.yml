name: Compilar APK de Android
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Liberar espacio en disco (Evita el error No space left on device)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Configurar GraalVM (Motor Nativo)
        uses: gluonhq/setup-graalvm@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Java 21 (Forzar para Gradle)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Forzar el uso de Maven 3.8.8
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.8
          
      - name: Instalar librerías base de Linux
        run: sudo apt-get update && sudo apt-get install -y build-essential libz-dev zlib1g-dev libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libgl1-mesa-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Configurar Android NDK 25.0.8775105
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Aumentar Memoria Swap (Evitar Crash de GraalVM)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Paso 1 - Compilar a Cliente Android
        run: mvn gluonfx:build -e -X

      - name: Extraer logs de error de GraalVM
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: graalvm-error-logs
          path: |
            target/gluonfx/log/
            target/gluonfx/**/gvm/log/

      - name: Paso 2 - Empaquetar el APK
        env:
          ANDROID_SDK_ROOT: ''
        run: mvn gluonfx:package

      - name: Guardar el APK final
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Aplicacion-Android
          path: '**/target/gluonfx/**/*.apk'
